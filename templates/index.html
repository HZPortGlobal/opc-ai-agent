<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 上架合规官 · 英国户外卖家运营工具</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e8ecf2;
    --mut:#8b93a3; --acc:#3da9fc; --acc2:#2ee6a6; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.6}
  .wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
  header h1{font-size:22px;margin:0 0 4px}
  header p{color:var(--mut);margin:0 0 22px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
  select,textarea,input{width:100%;background:#0f1217;border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:10px;font-size:14px;font-family:inherit}
  textarea{min-height:120px;resize:vertical}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>.card{flex:1;min-width:200px}
  button{background:var(--acc);color:#04121f;border:0;border-radius:8px;
    padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500;padding:8px 14px;font-size:13px}
  .out{white-space:pre-wrap;font-size:14px;background:#0f1217;border:1px solid var(--line);
    border-radius:8px;padding:14px;min-height:120px;color:var(--txt)}
  .meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:8px}
  .pill{display:inline-block;background:#11202c;color:var(--acc2);border:1px solid #1c3a2c;
    border-radius:999px;padding:2px 10px;font-size:12px}
  .err{color:var(--warn);font-size:13px;min-height:18px;margin-top:6px}
  footer{color:var(--mut);font-size:12px;margin-top:24px;text-align:center}
  .fb-btns{display:flex;gap:10px}
  .fb-btns button{flex:1}
  .hidden{display:none}
  .hero{background:linear-gradient(135deg,#11202c,#171a21);border:1px solid #1c3a2c}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 上架合规官</h1>
    <p>专为做英国/欧洲市场的中国出海卖家打造 —— 生成即合规，规避 GPSR 下架与绝对化宣称风险。</p>
  </header>

  <div class="card hero">
    <label>选择任务（主推「上架合规体检」）</label>
    <select id="scenario"></select>
  </div>

  <div class="row">
    <div class="card">
      <label>市场</label>
      <select id="market">
        <option value="uk">UK（英国）</option>
        <option value="eu">EU（欧洲）</option>
        <option value="us">US（美国）</option>
      </select>
    </div>
    <div class="card">
      <label>商品 / 主题 brief</label>
      <textarea id="brief" placeholder="把现成的 Listing（标题+卖点+描述）粘进来，我做合规体检"></textarea>
    </div>
  </div>

  <div class="card">
    <button id="go">生成</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card">
    <label>输出 <span class="pill" id="tag">ready</span></label>
    <div class="out" id="output">—</div>
    <p class="meta">生成结果由 AI 实时产出，复制即可使用。</p>
  </div>

  <!-- 数据飞轮：每次生成后收集「有用与否 + 愿付多少」 -->
  <div class="card hidden" id="fb">
    <label>这次结果有用吗？你的反馈会帮它越用越懂行。</label>
    <div class="fb-btns">
      <button id="up">👍 有用</button>
      <button id="down">👎 没用</button>
    </div>
    <label style="margin-top:10px">一句话：哪里好 / 哪里差（可选）</label>
    <textarea id="fbcomment" placeholder="比如：合规点抓得准、想要更具体的材质参数"></textarea>
    <label style="margin-top:10px">如果每周帮你省 2 小时，你愿付 £ 多少/月？</label>
    <input id="wtp" type="number" min="0" placeholder="如 20" />
    <div class="err" id="fberr"></div>
    <p class="meta" id="fbdone" style="display:none;color:var(--acc2)">已记录，谢谢！</p>
  </div>

  <div class="card">
    <a href="/waitlist" style="color:var(--acc);font-size:13px">→ 加入内测，第一时间用上合规官</a>
  </div>

  <footer>AI 上架合规官 · 为做英国/欧洲市场的出海卖家提供内容生成与合规体检</footer>
</div>

<script>
  // 匿名 uid：用于统计独立用户与基础留存（仅随机串，不关联任何个人信息）
  function getUid(){
    let u = localStorage.getItem('uid');
    if(!u){ u = (crypto.randomUUID && crypto.randomUUID()) || (Date.now()+''+Math.random()); localStorage.setItem('uid',u); }
    return u;
  }
  const UID = getUid();

  const SCENARIOS = {{ scenarios | tojson }};
  const PLACEHOLDERS = {
    "A_audit": "把现成的 Listing（标题+卖点+描述）粘进来，我做合规体检",
    "A_listing": "例：男士 3/2mm 冲浪潜水连体胶衣，再生尼龙，适合 UK 寒冷海域",
    "A_cs": "粘贴客户消息，例如：客户要求退一件有轻微破口的胶衣",
    "C_research": "例：2026 英国户外水上运动 DTC 市场趋势"
  };
  const sel = document.getElementById('scenario');
  for (const [k,v] of Object.entries(SCENARIOS)) {
    const o = document.createElement('option'); o.value = k; o.textContent = v; sel.appendChild(o);
  }
  const brief = document.getElementById('brief');
  function syncPlaceholder(){ brief.placeholder = PLACEHOLDERS[sel.value] || "输入内容"; }
  sel.onchange = syncPlaceholder; syncPlaceholder();

  const btn = document.getElementById('go');
  const out = document.getElementById('output');
  const err = document.getElementById('err');
  const tag = document.getElementById('tag');
  const fb = document.getElementById('fb');
  let lastMeta = null;

  btn.onclick = async () => {
    err.textContent = '';
    const b = brief.value.trim();
    if (!b) { err.textContent = '请先填写内容'; return; }
    const scenario = sel.value;
    const market = document.getElementById('market').value;
    lastMeta = {scenario, market};
    btn.disabled = true; tag.textContent = '生成中…'; out.textContent = '思考中…';
    fb.classList.add('hidden');
    try {
      const r = await fetch('/api/generate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({scenario, brief:b, market, uid:UID})
      });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error || '出错了'; out.textContent='—'; tag.textContent='error'; }
      else { out.textContent = d.output; tag.textContent='done'; fb.classList.remove('hidden'); document.getElementById('fbdone').style.display='none'; }
    } catch(e) { err.textContent = '网络错误：' + e.message; tag.textContent='error'; }
    finally { btn.disabled = false; }
  };

  async function sendFeedback(rating) {
    if (!lastMeta) return;
    const fberr = document.getElementById('fberr');
    fberr.textContent = '';
    const comment = document.getElementById('fbcomment').value.trim();
    const wtp = document.getElementById('wtp').value || 0;
    try {
      const r = await fetch('/api/feedback', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({...lastMeta, rating, comment, wtp})
      });
      const d = await r.json();
      if (!r.ok) { fberr.textContent = d.error || '提交失败'; return; }
      document.getElementById('fbdone').style.display = 'block';
    } catch(e) { fberr.textContent = '网络错误：' + e.message; }
  }
  document.getElementById('up').onclick = () => sendFeedback('up');
  document.getElementById('down').onclick = () => sendFeedback('down');
</script>
</body>
</html>
