services:
  - type: web
    name: opc-ai-agent
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: OPENAI_MODEL
        value: deepseek-chat
      - key: OPENAI_API_KEY      # 在 Render 后台 Secrets 里填，不要写进仓库
        sync: false
